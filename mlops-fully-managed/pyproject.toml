[project]
name = "ml-e2e"
version = "0.1.0"
description = "An engine that simplifies using SageMaker AI features, with runnable use cases"
requires-python = ">=3.10,<3.14"
dependencies = [
    "sagemaker>=3.5",
    # Pulled in by sagemaker too, but src/ imports both directly
    "mlflow>=3.0",
    "sagemaker-mlflow>=0.2",
    # Floor is where InstancePools landed; deploy.py calls create_endpoint_config
    # directly for the options the SageMaker SDK does not model yet
    "boto3>=1.43.1",
]

[dependency-groups]
dev = ["flake8>=7.0.0,<8.0.0"]

# The engine is run as scripts via `uv run`, not installed as a distributable
[tool.uv]
package = false
