# JumpStart's Qwen2-0.5B-Instruct weights served by the vLLM DLC (JumpStart's own recipe is
# DJL/LMI), with a public LoRA staged from the Hub and loaded as the "ru" adapter
model_name: qwen2-0-5b-instruct-ru-lora-jumpstart-g5-2x
endpoint_name: qwen2-0-5b-instruct-ru-lora-jumpstart-g5-2x
model_data_s3_uri: "s3://jumpstart-cache-prod-us-west-2/huggingface-llm/huggingface-llm-qwen2-0-5b-instruct/artifacts/inference-prepack/v1.0.0/"
# Mounted at /opt/ml/additional-model-data-sources/ru_lora, which SM_VLLM_LORA_MODULES points at
additional_model_data_sources:
  - channel_name: ru_lora
    huggingface:
      model_id: sikoraaxd/Qwen2-0.5B-Instruct-ru-lora
      # curl -s https://huggingface.co/api/models/sikoraaxd/Qwen2-0.5B-Instruct-ru-lora | jq -r .sha
      revision: f1fa56303ae329d2c19f61e2fd51a82c48e32003
      stage_to_s3: "s3://sagemaker-us-west-2-123456789012/hf-weights/"
image_uri: 763104351884.dkr.ecr.us-west-2.amazonaws.com/vllm:0.19.1-gpu-py312-cu129-ubuntu22.04-sagemaker-v1.1
# JumpStart publishes this model for g5 types only
instance_preferences:
  - ml.g5.2xlarge
instance_count: 1
inference_ami_version: al2023-ami-sagemaker-inference-gpu-4-1
environment:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1
  HF_MODEL_ID: /opt/ml/model
  SM_VLLM_MODEL: /opt/ml/model
  SM_VLLM_SERVED_MODEL_NAME: qwen2-0-5b-instruct
  MAX_CONCURRENT_REQUESTS: 8
  SM_VLLM_MAX_NUM_SEQS: 8
  SM_VLLM_MAX_MODEL_LEN: 4096
  SM_VLLM_MAX_NUM_BATCHED_TOKENS: 262144
  SM_VLLM_GPU_MEMORY_UTILIZATION: 0.85
  SM_VLLM_TENSOR_PARALLEL_SIZE: 1
  TENSOR_PARALLEL_DEGREE: 1
  SM_VLLM_DATA_PARALLEL_SIZE: 1
  SM_VLLM_PIPELINE_PARALLEL_SIZE: 1
  SM_VLLM_DTYPE: auto
  # Requests with "model": "ru" use the adapter
  SM_VLLM_ENABLE_LORA: true
  SM_VLLM_MAX_LORA_RANK: 16
  SM_VLLM_LORA_MODULES: ru=/opt/ml/additional-model-data-sources/ru_lora
enable_network_isolation: true
serializer: json
deserializer: json
payload_path: ./deploy/payload.chat.json
sagemaker_execution_role: arn:aws:iam::123456789012:role/service-role/AmazonSageMaker-ExecutionRole-EXAMPLE
