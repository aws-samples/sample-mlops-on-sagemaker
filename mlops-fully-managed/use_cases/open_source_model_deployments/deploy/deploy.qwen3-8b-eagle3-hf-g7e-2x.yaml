# Qwen/Qwen3-8B with a separate eagle3 draft head; both staged from HuggingFace
model_name: qwen3-8b-eagle3-hf-g7e-2x
endpoint_name: qwen3-8b-eagle3-hf-g7e-2x
huggingface:
  model_id: Qwen/Qwen3-8B
  # The commit to stage
  # curl -s https://huggingface.co/api/models/Qwen/Qwen3-8B | jq -r .sha
  revision: b968826d9c46dd6066d109eabc6255188de91218
  stage_to_s3: "s3://sagemaker-us-west-2-123456789012/hf-weights/"
# Staged on its own commit and mounted at /opt/ml/additional-model-data-sources/eagle3,
# which is what SM_VLLM_SPECULATIVE_CONFIG below points at
additional_model_data_sources:
  - channel_name: eagle3
    huggingface:
      model_id: Tengyunw/qwen3_8b_eagle3
      revision: 2a1059d51f622b8cad7d7d72840153ffea5488a0
image_uri: 763104351884.dkr.ecr.us-west-2.amazonaws.com/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-sagemaker-v1.4
instance_preferences:
  - ml.g7e.2xlarge
instance_count: 1
model_data_download_timeout_seconds: 2400
startup_health_check_timeout_seconds: 2400
# Serving settings
environment:
  ENDPOINT_SERVER_TIMEOUT: 3600
  HF_MODEL_ID: /opt/ml/model
  MODEL_CACHE_ROOT: /opt/ml/model
  SAGEMAKER_CONTAINER_LOG_LEVEL: 20
  SAGEMAKER_MODEL_SERVER_TIMEOUT: 3600
  SAGEMAKER_MODEL_SERVER_WORKERS: 1
  TENSOR_PARALLEL_DEGREE: 1
  SM_VLLM_MAX_MODEL_LEN: 32768
  SM_VLLM_REASONING_PARSER: qwen3
  SM_VLLM_TOOL_CALL_PARSER: hermes
  SM_VLLM_ENABLE_AUTO_TOOL_CHOICE: ""
  # num_speculative_tokens is the knob to sweep
  SM_VLLM_SPECULATIVE_CONFIG: '{"model": "/opt/ml/additional-model-data-sources/eagle3", "method": "eagle3", "num_speculative_tokens": 3}'
enable_network_isolation: true
serializer: json
deserializer: json
payload_path: ./deploy/payload.chat.json
sagemaker_execution_role: "arn:aws:iam::123456789012:role/service-role/AmazonSageMaker-ExecutionRole-EXAMPLE"
