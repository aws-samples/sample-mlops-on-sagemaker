# Metadata
job_name: climatology-model-evaluation

# Data
# The test dataset
raw_data_s3_path: "s3://amzn-s3-demo-bucket/climatology/processed/test"

# Output this evaluation's test metrics so the Model Card Lambda function
# can read it
metadata_output_s3_path: "s3://amzn-s3-demo-bucket/climatology/evaluation/metadata"

# Code
source_code_dir: ./process/evaluation

# The model comes from the registry and our wrapper code appends --model_package_arn from the parent register step
source_code_entry_point_command: >-
  python evaluate_model.py

# Compute
image_uri: 246618743249.dkr.ecr.us-west-2.amazonaws.com/sagemaker-scikit-learn:1.9-0
instance_type: ml.m5.2xlarge
instance_count: 1
instance_volume_size: 50
keep_alive_hours: 1
max_runtime_hours: 1

# Experiment tracking
mlflow_arn: "arn:aws:sagemaker:us-west-2:123456789012:mlflow-app/app-EXAMPLE123"
mlflow_experiment_name: climatology

# Permissions
sagemaker_execution_role: "arn:aws:iam::123456789012:role/service-role/AmazonSageMaker-ExecutionRole-EXAMPLE"
