# Metadata
job_name: climatology-ghcn-processing

# Data
# 1,907 station CSVs, sharded across the cluster one whole object at a time
raw_data_s3_path: "s3://amzn-s3-demo-bucket/data/ghcn/by_station/"
train_data_output_s3_path: "s3://amzn-s3-demo-bucket/climatology/processed/train"
validation_data_output_s3_path: "s3://amzn-s3-demo-bucket/climatology/processed/validation"
test_data_output_s3_path: "s3://amzn-s3-demo-bucket/climatology/processed/test"

# Code
source_code_dir: ./process/ghcn
source_code_entry_point_command: >-
  python ghcn_process.py
  --stations_s3_uri s3://amzn-s3-demo-bucket/data/ghcn/ghcnd-stations.txt
  --start_year 2015
  --validation_start_year 2023
  --test_start_year 2024

# Compute
# instance_count > 1 is the whole point: each instance gets ~636 of the station
# files and writes its own shard of each split
image_uri: 246618743249.dkr.ecr.us-west-2.amazonaws.com/sagemaker-scikit-learn:1.9-0
instance_type: ml.m5.2xlarge
instance_count: 3
instance_volume_size: 50
keep_alive_hours: 1
max_runtime_hours: 2

# Experiment tracking
mlflow_arn: "arn:aws:sagemaker:us-west-2:123456789012:mlflow-app/app-EXAMPLE123"
mlflow_experiment_name: climatology

# Permissions
sagemaker_execution_role: "arn:aws:iam::123456789012:role/service-role/AmazonSageMaker-ExecutionRole-EXAMPLE"
