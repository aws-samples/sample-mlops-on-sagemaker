# How the model is served
deploy_type: batch

# model_package_arn: "arn:aws:sagemaker:us-west-2:123456789012:model-package/climatology-package-group/2"
model_data_s3_uri: "s3://amzn-s3-demo-bucket/climatology/best-model/model.tar.gz"
model_name: climatology-best-model

# Code
source_code_dir: ./deploy/best_model
entry_script: inference.py

# Compute
image_uri: 246618743249.dkr.ecr.us-west-2.amazonaws.com/sagemaker-scikit-learn:1.9-0
instance_preferences:
  - ml.m5.2xlarge
instance_count: 1

# --- Batch Transform settings (deploy_type: batch) ---
batch:
  # Headerless CSV supplied by the user, target in column 0
  input_s3_path: "s3://amzn-s3-demo-bucket/climatology/batch-input"
  output_s3_path: "s3://amzn-s3-demo-bucket/climatology/predictions"
  content_type: text/csv
  accept: text/csv
  split_type: Line
  assemble_with: Line
  strategy: MultiRecord
  # The input carries the target in column 0, so drop it before scoring, join
  # each prediction back onto its input record, then keep just actual and
  # predicted -- which is what the reporting step reads
  input_filter: "$[1:]"
  join_source: Input
  output_filter: "$[0,-1]"

# Permissions
sagemaker_execution_role: "arn:aws:iam::123456789012:role/service-role/AmazonSageMaker-ExecutionRole-EXAMPLE"